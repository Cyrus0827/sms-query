<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>短信记录查询</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 720px; margin: 32px auto; padding: 0 16px; background: #f5f7fa; color: #1f2937; font-size: 14px; }
  h1 { font-size: 18px; margin: 0 0 20px; }
  .box { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
  .lbl { font-size: 12px; color: #6b7280; margin-bottom: 6px; }
  input, textarea { width: 100%; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px; font: inherit; background: #fff; }
  textarea { font-family: ui-monospace, Consolas, monospace; resize: vertical; }
  .row { display: flex; gap: 8px; }
  .row > input { flex: 1; }
  button { padding: 8px 14px; background: #2563eb; color: #fff; border: 0; border-radius: 6px; cursor: pointer; font: inherit; }
  button:hover { background: #1d4ed8; }
  button:disabled { background: #9ca3af; cursor: not-allowed; }
  .acts { display: flex; gap: 12px; margin-top: 10px; align-items: center; }
  .chk { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #4b5563; cursor: pointer; user-select: none; }
  .chk input { margin: 0; cursor: pointer; }
  .err { color: #dc2626; font-size: 12px; margin-top: 6px; min-height: 16px; }
</style>
</head>
<body>

<h1>短信记录查询</h1>

<div class="box">
  <div class="lbl">输入</div>
  <textarea id="in" rows="2" placeholder="输入复制的内容"></textarea>
  <div id="eIn" class="err"></div>
</div>

<div class="box">
  <div class="lbl">号码</div>
  <div class="row">
    <input id="phone" readonly placeholder=" ">
    <button id="cp" disabled>复制</button>
  </div>
</div>

<div class="box">
  <div class="lbl">API 返回</div>
  <textarea id="out" rows="3" readonly placeholder=" "></textarea>
  <div class="acts">
    <button id="go">查询</button>
    <label class="chk"><input type="checkbox" id="raw"> 显示原始 JSON</label>
  </div>
  <div id="eOut" class="err"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const inp = $('in'), phone = $('phone'), cp = $('cp'),
      out = $('out'), go = $('go'), raw = $('raw'),
      eIn = $('eIn'), eOut = $('eOut');

let lastUrl = '';
let lastJson = null;

function parse(t) {
  const i = t.indexOf('----');
  if (i < 0) return null;
  const phone = t.slice(0, i).trim();
  let url = t.slice(i + 4).trim();
  const stop = url.search(/[\s"'<>}\]]/);
  if (stop >= 0) url = url.slice(0, stop);
  return { phone, url };
}

function fmtPhone(p) {
  const m = p.match(/^\+1?(\d{10})$/);
  return m ? `${m[1].slice(0,3)} ${m[1].slice(3,6)} ${m[1].slice(6,10)}` : null;
}

function renderOut() {
  if (!lastJson) { out.value = ''; return; }
  out.value = raw.checked
    ? JSON.stringify(lastJson, null, 2)
    : ((lastJson.data && lastJson.data.code) || '(空 code)');
}

inp.addEventListener('input', () => {
  eIn.textContent = ''; eOut.textContent = '';
  const p = parse(inp.value.trim());
  if (!p) { phone.value = ''; cp.disabled = true; if (inp.value.trim()) eIn.textContent = '格式：+1XXXXXXXXXX----URL'; return; }
  const f = fmtPhone(p.phone);
  if (!f) { phone.value = ''; cp.disabled = true; eIn.textContent = '手机号格式错'; return; }
  phone.value = f; cp.disabled = false;
  if (lastJson) { lastJson = null; lastUrl = ''; out.value = ''; go.textContent = '查询'; go.disabled = false; }
});

cp.addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(phone.value);
    const o = cp.textContent; cp.textContent = '已复制'; setTimeout(()=>cp.textContent=o, 1200);
  } catch (e) { eIn.textContent = '复制失败：' + e.message; }
});

async function query() {
  eOut.textContent = '';
  const p = parse(inp.value.trim());
  if (!p) { eOut.textContent = '格式错误'; go.textContent = '查询'; go.disabled = false; return; }
  go.disabled = true; go.textContent = '请求中...';
  try {
    const r = await fetch(p.url);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    if (j.code !== undefined && j.code !== 0) throw new Error('API ' + j.code + ' ' + (j.msg||''));
    lastUrl = p.url;
    lastJson = j;
    renderOut();
    go.textContent = '刷新';
    go.disabled = false;
  } catch (e) {
    eOut.textContent = '失败：' + e.message;
    go.textContent = '查询';
    go.disabled = false;
  }
}

go.addEventListener('click', query);
raw.addEventListener('change', renderOut);
</script>
</body>
</html>
