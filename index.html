<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>短信记录查询</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0 auto; padding: 16px 14px 40px; background: #f5f7fa; color: #1f2937; font-size: 18px; }
  h1 { font-size: 24px; margin: 0 0 20px; font-weight: 600; }
  .box { background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; padding: 18px 18px; margin-bottom: 14px; }
  .lbl { font-size: 14px; color: #6b7280; margin-bottom: 8px; }
  input, textarea { width: 100%; padding: 14px 14px; border: 1px solid #d1d5db; border-radius: 10px; font: inherit; background: #fff; font-size: 17px; line-height: 1.4; }
  textarea { font-family: ui-monospace, Consolas, monospace; resize: vertical; }
  .row { display: flex; gap: 8px; }
  .row > input { flex: 1; min-width: 0; }
  button { padding: 14px 20px; background: #2563eb; color: #fff; border: 0; border-radius: 10px; cursor: pointer; font: inherit; font-size: 17px; font-weight: 500; min-height: 48px; -webkit-tap-highlight-color: transparent; }
  button:hover { background: #1d4ed8; }
  button:disabled { background: #9ca3af; cursor: not-allowed; }
  .acts { display: flex; gap: 12px; margin-top: 12px; align-items: center; }
  .url { font-family: ui-monospace, Consolas, monospace; font-size: 14px; color: #1f2937; word-break: break-all; background: #f9fafb; padding: 14px; border: 1px solid #e5e7eb; border-radius: 10px; margin-bottom: 12px; max-height: 140px; overflow-y: auto; line-height: 1.5; }
  .err { color: #dc2626; font-size: 14px; margin-top: 8px; min-height: 16px; }
</style>
</head>
<body>

<h1>短信记录查询</h1>

<div class="box">
  <div class="lbl">输入</div>
  <textarea id="in" rows="2" placeholder="输入复制的内容"></textarea>
  <div id="eIn" class="err"></div>
</div>

<div class="box">
  <div class="lbl">号码</div>
  <div class="row">
    <input id="phone" readonly placeholder=" ">
    <button id="cp" disabled>复制</button>
  </div>
</div>

<div class="box">
  <div class="lbl">访问 API</div>
  <div id="url" class="url"> </div>
  <div class="acts">
    <button id="open" disabled>打开链接</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const inp = $('in'), phone = $('phone'), cp = $('cp'),
      open = $('open'), url = $('url'),
      eIn = $('eIn');

let lastUrl = '';

function parse(t) {
  const i = t.indexOf('----');
  if (i < 0) return null;
  const phone = t.slice(0, i).trim();
  let url = t.slice(i + 4).trim();
  const stop = url.search(/[\s"'<>}\]]/);
  if (stop >= 0) url = url.slice(0, stop);
  return { phone, url };
}

function fmtPhone(p) {
  const m = p.match(/^\+1?(\d{10})$/);
  return m ? `${m[1].slice(0,3)} ${m[1].slice(3,6)} ${m[1].slice(6,10)}` : null;
}

inp.addEventListener('input', () => {
  eIn.textContent = '';
  const p = parse(inp.value.trim());
  if (!p) {
    phone.value = ''; cp.disabled = true; open.disabled = true; url.textContent = ' ';
    if (inp.value.trim()) eIn.textContent = '格式：+1XXXXXXXXXX----URL';
    return;
  }
  const f = fmtPhone(p.phone);
  if (!f) {
    phone.value = ''; cp.disabled = true; open.disabled = true; url.textContent = ' ';
    eIn.textContent = '手机号格式错';
    return;
  }
  phone.value = f; cp.disabled = false;
  if (p.url !== lastUrl) { lastUrl = p.url; url.textContent = p.url; }
  open.disabled = false;
});

cp.addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(phone.value);
    const o = cp.textContent; cp.textContent = '已复制'; setTimeout(()=>cp.textContent=o, 1200);
  } catch (e) { eIn.textContent = '复制失败：' + e.message; }
});

open.addEventListener('click', () => {
  if (lastUrl) window.open(lastUrl, '_blank');
});
</script>
</body>
</html>
